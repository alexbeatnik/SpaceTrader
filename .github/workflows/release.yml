name: Release

# Builds the Windows installer and portable exe and publishes them as a GitHub
# Release whenever the version in package.json changes on main. Safe to run on
# every push: it no-ops if a release for the current version already exists.
# Can also be triggered manually to (re)build and publish the current version.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        shell: pwsh
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if (-not $ver) {
            Write-Error "Could not read version from package.json"
            exit 1
          }
          Write-Host "Version: $ver"
          "version=$ver" >> $env:GITHUB_OUTPUT
          "tag=v$ver" >> $env:GITHUB_OUTPUT

      - name: Skip if this version was already released
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.version.outputs.tag }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release ${{ steps.version.outputs.tag }} already exists, skipping."
            "skip=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "No release yet for ${{ steps.version.outputs.tag }} - will create one."
            "skip=false" >> $env:GITHUB_OUTPUT
          }
          # pwsh steps exit with the last-seen $LASTEXITCODE, which `gh release view`
          # deliberately left non-zero above (that's how we detect "no release yet") -
          # without this the step itself would be reported as failed.
          exit 0

      - name: Setup Node
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm 11 does not run install scripts without explicit approval. The
      # approvals live in the allowScripts field of package.json - without them
      # Electron never downloads its binary and the build fails.
      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: npm ci

      - name: Typecheck
        if: steps.check.outputs.skip == 'false'
        run: npm run typecheck

      - name: Test
        if: steps.check.outputs.skip == 'false'
        run: npm test

      - name: Build
        if: steps.check.outputs.skip == 'false'
        run: npx electron-vite build

      # --publish never: the release is created by gh below, so electron-builder
      # only has to produce the files. Left to itself it would upload them to a
      # draft release, which never becomes visible.
      #
      # latest.yml is still written (it comes from build.publish in package.json,
      # not from this flag) and MUST be uploaded with the installer - it is the
      # file the in-app updater reads to discover a new version.
      - name: Package
        if: steps.check.outputs.skip == 'false'
        run: npx electron-builder --win nsis portable --publish never

      - name: Create tag and GitHub Release
        if: steps.check.outputs.skip == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = "release/StarTrader-${{ steps.version.outputs.version }}-setup.exe"
          $portable = "release/StarTrader-${{ steps.version.outputs.version }}-portable.exe"
          $latest = "release/latest.yml"
          foreach ($f in @($setup, $portable, $latest)) {
            if (-not (Test-Path $f)) {
              Write-Error "Expected artifact not found: $f"
              exit 1
            }
          }
          # The updater resolves the installer through the name recorded in
          # latest.yml, so the uploaded asset name has to match it exactly.
          $expected = (Select-String -Path $latest -Pattern '^path:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          if ($expected -ne (Split-Path $setup -Leaf)) {
            Write-Error "latest.yml points at '$expected' but the installer is '$(Split-Path $setup -Leaf)' - the updater would 404."
            exit 1
          }
          gh release create "${{ steps.version.outputs.tag }}" $setup $portable $latest `
            --title "${{ steps.version.outputs.tag }}" `
            --generate-notes
