name: Release

# Builds the Windows installer, the portable exe and the Android APK, and
# publishes all three as a GitHub Release whenever the version in package.json
# changes on main. Safe to run on every push: it no-ops if a release for the
# current version already exists. Can also be triggered manually to (re)build
# and publish the current version.
#
# Three jobs rather than one. The version check is split out so neither build
# starts for a version that is already released, and the APK is built on Linux
# — the Android SDK is preinstalled there, and the Windows runner has no
# business compiling it just because that is where electron-builder has to run.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: |
          ver=$(node -p "require('./package.json').version")
          if [ -z "$ver" ]; then
            echo "Could not read version from package.json" >&2
            exit 1
          fi
          echo "Version: $ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"

      - name: Skip if this version was already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.tag }} already exists, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release yet for ${{ steps.version.outputs.tag }} - will create one."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  android:
    name: Android APK
    needs: check
    if: needs.check.outputs.skip == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Capacitor 7 builds with Android Gradle Plugin 8.x, which refuses to run
      # on anything older than JDK 17.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Nothing in this job launches Electron — the mobile build only needs the
      # renderer — so its ~100 MB binary download is skipped.
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Build web bundle
        run: npm run build:web

      # Copies dist-web into the Android project and refreshes the native
      # plugin registry. Without it the APK ships stale assets.
      - name: Sync Capacitor
        run: npx cap sync android

      # gradlew is generated on a Windows machine, where git records no execute
      # bit; without this the next step fails with "permission denied".
      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the artifact after the version
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk \
             "SpaceTrader-${{ needs.check.outputs.version }}-debug.apk"

      - name: Upload APK for the release job
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: SpaceTrader-${{ needs.check.outputs.version }}-debug.apk
          if-no-files-found: error
          retention-days: 1

  release:
    name: Windows build and publish
    needs: [check, android]
    if: needs.check.outputs.skip == 'false'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\electron-cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # npm 11 does not run install scripts without explicit approval. The
      # approvals live in the allowScripts field of package.json - without them
      # Electron never downloads its binary and the build fails.
      - name: Install dependencies
        shell: pwsh
        env:
          ELECTRON_CACHE: ${{ runner.temp }}\electron-cache
        run: |
          $attempts = 3
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            npm ci
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -lt $attempts) {
              Write-Warning "npm ci failed on attempt $attempt/$attempts; retrying in 10 seconds."
              Start-Sleep -Seconds 10
            }
          }
          exit 1

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npx electron-vite build

      # --publish never: the release is created by gh below, so electron-builder
      # only has to produce the files. Left to itself it would upload them to a
      # draft release, which never becomes visible.
      #
      # latest.yml is still written (it comes from build.publish in package.json,
      # not from this flag) and MUST be uploaded with the installer - it is the
      # file the in-app updater reads to discover a new version.
      - name: Package
        run: npx electron-builder --win nsis portable --publish never

      - name: Download the APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release

      - name: Create tag and GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ needs.check.outputs.version }}"
          $setup = "release/SpaceTrader-$version-setup.exe"
          $portable = "release/SpaceTrader-$version-portable.exe"
          $latest = "release/latest.yml"
          $apk = "release/SpaceTrader-$version-debug.apk"
          # The updater asks for "<installer>.blockmap" on both the installed
          # version and the new one so it can download only the parts that
          # changed. A release without it still updates - it just falls back to
          # pulling all 80-odd MB again, every time, for a build that usually
          # differs by a few hundred KB.
          $blockmap = "$setup.blockmap"
          foreach ($f in @($setup, $blockmap, $portable, $latest, $apk)) {
            if (-not (Test-Path $f)) {
              Write-Error "Expected artifact not found: $f"
              exit 1
            }
          }
          # The updater resolves the installer through the name recorded in
          # latest.yml, so the uploaded asset name has to match it exactly.
          $expected = (Select-String -Path $latest -Pattern '^path:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          if ($expected -ne (Split-Path $setup -Leaf)) {
            Write-Error "latest.yml points at '$expected' but the installer is '$(Split-Path $setup -Leaf)' - the updater would 404."
            exit 1
          }
          gh release create "${{ needs.check.outputs.tag }}" $setup $blockmap $portable $latest $apk `
            --title "${{ needs.check.outputs.tag }}" `
            --generate-notes
